name: CodeGraph native Windows unchanged main failure subset
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Pin LF bytes
      shell: bash
      run: 'git config --global core.autocrlf false

        git config --global core.eol lf'
    - uses: actions/checkout@v4
      with:
        repository: colbymchenry/codegraph
        ref: f66d064279c02f483c33602abec2e5ce9e13522a
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22.22.3
        cache: npm
    - name: Frozen dependencies and native build
      shell: bash
      run: 'npm ci

        npm run build

        npm run build:lib'
    - name: Unchanged bounded baseline subset
      shell: python
      run: 'import subprocess,pathlib,os,json,hashlib,xml.etree.ElementTree as ET

        out=pathlib.Path(os.environ[''RUNNER_TEMP''])/''windows-main-subset'';out.mkdir()

        head=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip();assert
        head==''f66d064279c02f483c33602abec2e5ce9e13522a''

        meta=json.loads(subprocess.check_output([''node'',''-p'',"JSON.stringify({node:process.version,platform:process.platform,tmp:require(''os'').tmpdir(),realTmp:require(''fs'').realpathSync.native(require(''os'').tmpdir()),image:process.env.ImageOS,imageVersion:process.env.ImageVersion})"],text=True));assert
        meta[''node'']==''v22.22.3'' and meta[''platform'']==''win32''

        meta.update({''head'':head,''git'':subprocess.check_output([''git'',''--version''],text=True).strip(),''lock_sha256'':hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest()})

        (out/''runtime.json'').write_text(json.dumps(meta,indent=2))

        files=[''__tests__/worktree-detection.test.ts'', ''__tests__/git-hooks.test.ts'',
        ''__tests__/mcp-nested-repo-projectpath.test.ts'', ''__tests__/daemon-older-version.test.ts'',
        ''__tests__/daemon-pid-reuse.test.ts'', ''__tests__/mcp-daemon.test.ts'']

        # Read-only correspondence, not a normalization intervention: keep hosted
        runner TEMP/TMP exactly as provided.

        meta[''same_short_vs_long_temp_form'']=''~''in meta[''tmp''] and ''~''not
        in meta[''realTmp''];(out/''runtime.json'').write_text(json.dumps(meta,indent=2))

        output_path=str(out/''junit.xml'').replace(chr(92),''/'')

        assert not any(c in output_path for c in ['' '',chr(34),''&'',''|'',''<'',''>''])

        command=''npx --no-install vitest run ''+'' ''.join(files)+'' --reporter=default
        --reporter=junit --outputFile.junit=''+output_path

        with (out/''focused.log'').open(''w'')as log:r=subprocess.run([''cmd.exe'',''/d'',''/s'',''/c'',command],stdout=log,stderr=subprocess.STDOUT)

        x=ET.parse(out/''junit.xml'').getroot();cases=x.findall(''.//testcase'');assert
        len(cases)==93,(len(cases),x.attrib)

        failures=[{''suite'':t.attrib.get(''classname''),''name'':t.attrib[''name''],''message'':(t.find(''failure'').text
        or '''')}for t in cases if t.find(''failure'')is not None]

        assert not x.findall(''.//error'');subprocess.run([''git'',''diff'',''--exit-code''],check=True)

        (out/''classification.json'').write_text(json.dumps({''runtime'':meta,''command'':command,''returncode'':r.returncode,''total'':len(cases),''failed'':len(failures),''skipped'':len(x.findall(''.//skipped'')),''errors'':0,''failures'':failures,''test_hashes'':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()for
        p in files},''tracked_source_clean'':True,''classification'':''ACTUAL_MAIN_SUBSET_RESULTS_REQUIRE_FAILURE_PAIR_COMPARISON''},indent=2))

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codegraph-windows-main-subset-${{ github.run_id }}
        path: ${{ runner.temp }}/windows-main-subset/
        if-no-files-found: error
