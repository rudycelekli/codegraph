name: CodeGraph existing PR conflict qualification
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: [2251, 2252, 2253, 2254]
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      QUALIFICATION_PAYLOAD: 
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact LF source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          repository: colbymchenry/codegraph
          ref: f66d064279c02f483c33602abec2e5ce9e13522a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Decode reviewed candidate
        env:
          PR: ${{ matrix.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/codegraph-qualification"
          node <<'JS'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
          const payload=JSON.parse(Buffer.from(process.env.QUALIFICATION_PAYLOAD,'base64').toString());
          const c=payload.find(x=>x.pr===Number(process.env.PR));
          const patch=Buffer.from(c.patch_base64,'base64');
          if(crypto.createHash('sha256').update(patch).digest('hex')!==c.patch_sha256)throw Error('patch mismatch');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/codegraph-qualification/candidate.json',JSON.stringify(c,null,2));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/codegraph-qualification/candidate.patch',patch);
          cp.execFileSync('git',['apply','--index','--whitespace=error',process.env.RUNNER_TEMP+'/codegraph-qualification/candidate.patch']);
          for(const [p,h]of Object.entries(c.postimages))if(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==h)throw Error('postimage mismatch '+p);
          const changed=cp.execFileSync('git',['diff','--name-only','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).sort();
          if(JSON.stringify(changed)!==JSON.stringify(c.paths.slice().sort()))throw Error('path mismatch');
          JS
      - name: Install exact lock and build native candidate
        run: |
          npm ci
          npm run build
          npm run build:lib
      - name: Full repository engine and UI suites
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/codegraph-qualification/full-junit.xml" 2>&1 | tee "$RUNNER_TEMP/codegraph-qualification/full.log"
      - name: Exact final tracked identity
        if: always()
        run: |
          node <<'JS'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
          const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/codegraph-qualification/candidate.json'));
          const expected=cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim();
          const paths=cp.execFileSync('git',['diff','--name-only','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).sort();
          for(const[p,h]of Object.entries(c.postimages))if(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==h)throw Error('mutated postimage '+p);
          cp.execFileSync('git',['diff','--exit-code']);
          if(expected!==c.candidate_tree || JSON.stringify(paths)!==JSON.stringify(c.paths.slice().sort()))throw Error('tree or paths mismatch');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/codegraph-qualification/final-identity.json',JSON.stringify({pr:c.pr,tree:expected,patch:c.patch_sha256,node:process.version,platform:process.platform,ok:true},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegraph-${{ matrix.pr }}-${{ matrix.os }}
          path: ${{ runner.temp }}/codegraph-qualification/
          if-no-files-found: error
