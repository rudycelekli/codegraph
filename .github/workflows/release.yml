name: CodeGraph exact main dedup failure comparison
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Pin LF bytes
      shell: bash
      run: 'git config --global core.autocrlf false

        git config --global core.eol lf'
    - uses: actions/checkout@v4
      with:
        repository: colbymchenry/codegraph
        ref: f66d064279c02f483c33602abec2e5ce9e13522a
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22.22.3
        cache: npm
    - name: Frozen dependencies and native build
      run: 'npm ci

        npm run build

        npm run build:lib'
    - name: Unmodified single-file baseline classification
      shell: python
      run: 'import subprocess,pathlib,os,json,hashlib,xml.etree.ElementTree as ET

        out=pathlib.Path(os.environ[''RUNNER_TEMP''])/''main-dedup'';out.mkdir()

        head=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip();assert
        head==''f66d064279c02f483c33602abec2e5ce9e13522a''

        with (out/''focused.log'').open(''w'')as log:r=subprocess.run([''npx'',''--no-install'',''vitest'',''run'',''__tests__/explore-cross-call-dedup.test.ts'',''--reporter=default'',''--reporter=junit'',''--outputFile.junit=''+str(out/''junit.xml'')],stdout=log,stderr=subprocess.STDOUT)

        x=ET.parse(out/''junit.xml'').getroot();cases=x.findall(''.//testcase'');assert
        len(cases)==26,(len(cases),x.attrib)

        failures=[{''name'':t.attrib[''name''],''failure'':(t.find(''failure'').text
        or '''')}for t in cases if t.find(''failure'')is not None]

        assert not x.findall(''.//error'');assert not x.findall(''.//skipped'');assert
        len(failures)<=1

        if failures:assert ''never re-sends a line it already sent'' in failures[0][''name'']
        and ''call 2 re-sent internal/usecase/payroll/cycle.go lines 31,32,33,34,35''
        in failures[0][''failure'']

        assert r.returncode==(1 if failures else 0)

        subprocess.run([''git'',''diff'',''--exit-code''],check=True)

        (out/''classification.json'').write_text(json.dumps({''head'':head,''node'':subprocess.check_output([''node'',''--version''],text=True).strip(),''platform'':os.uname().sysname,''lock_sha256'':hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest(),''test_sha256'':hashlib.sha256(pathlib.Path(''__tests__/explore-cross-call-dedup.test.ts'').read_bytes()).hexdigest(),''returncode'':r.returncode,''total'':26,''passed'':26-len(failures),''failed'':len(failures),''skips'':0,''errors'':0,''failures'':failures,''classification'':''BASELINE_REPRODUCED''if
        failures else''BASELINE_NOT_REPRODUCED'',''tracked_source_clean'':True},indent=2))

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codegraph-main-dedup-${{ github.run_id }}
        path: ${{ runner.temp }}/main-dedup/
        if-no-files-found: error
